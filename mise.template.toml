# mise 설정 템플릿
# 이 파일을 복사해서 본인 토큰 값을 채우세요:
#   cp mise.template.toml mise.toml
#
# `mise.toml`은 .gitignore에 등록되어 있어 커밋되지 않습니다.
# 절대 실제 토큰 값을 이 템플릿 파일에 직접 적지 마세요.

[tools]
bun = "1.3.13"

[env]
# Linear provider를 사용할 때 필요 (https://linear.app/settings/api 에서 발급)
LINEAR_API_KEY = "lin_api_..."

# GitHub Projects provider를 사용할 때 필요
# (https://github.com/settings/tokens 에서 `project` scope로 발급, private repo면 `repo`도)
GITHUB_TOKEN = "ghp_..."
