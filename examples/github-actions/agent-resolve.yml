# Agent Worker — PR Conflict Resolution
#
# 사용 방법:
#   1. 이 파일을 target repo (PR이 열리는 저장소)의 `.github/workflows/` 에 복사
#   2. target repo Settings → Secrets → Actions 에 `ANTHROPIC_API_KEY` 추가
#   3. (선택) Settings → Secrets → Actions 에 `CLAUDE_CODE_OAUTH_TOKEN` 으로 대체 가능
#
# 동작:
#   PR 코멘트에 "@agent-worker resolve" 가 포함되면 트리거됩니다. 작성자가 write 권한
#   이상 (OWNER / COLLABORATOR / MEMBER) 일 때만 실제로 실행되며, 그 외 권한은 action
#   내부에서 자동으로 차단됩니다.
#
#   Claude 가 PR 브랜치에서 base 브랜치와의 conflict 를 해결하고 결과 커밋을 PR 브랜치
#   에 push 합니다. 머지 자체는 (의도적으로) 사람이 직접 수행합니다.
#
# 트리거 예시:
#   "@agent-worker resolve"
#   "@agent-worker resolve — main 쪽 변경을 우선해줘"
#   "@agent-worker resolve: keep both implementations and combine them"

name: Agent Worker — Resolve PR Conflicts

on:
  issue_comment:
    types: [created]

jobs:
  resolve:
    # PR 코멘트에 한해서만 (issue 코멘트 제외) 트리거 어구가 있을 때 실행
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, '@agent-worker resolve')
    runs-on: ubuntu-latest
    permissions:
      contents: write       # resolution commit push
      pull-requests: write  # PR 코멘트
      issues: write         # 코멘트
      id-token: write       # claude-code-action OIDC 인증 (필수)
      actions: read         # claude-code-action CI 결과 읽기 (선택)
      statuses: write       # PR 페이지 내 commit status 표시
    steps:
      # PR 페이지 하단에 "agent-worker/resolve — pending" 표시. 클릭하면 Action run 으로 이동.
      - name: Mark check pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_SHA=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} --jq .head.sha)
          gh api repos/${{ github.repository }}/statuses/$PR_SHA -X POST \
            -f state=pending \
            -f context="agent-worker/resolve" \
            -f description="충돌 해결 작업 진행 중..." \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # 인증은 둘 중 하나만 활성화하세요. 등록한 secret 이름과 input 이름이 정확히
          # 일치해야 합니다 (대소문자 포함).
          #
          # (A) Claude Pro / Max 구독자 — `claude setup-token` 으로 발급
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # (B) Anthropic API key 사용자 (위 줄을 지우고 아래 줄 사용)
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          trigger_phrase: "@agent-worker resolve"

          # Claude Code 의 도구 허용 목록 — git/gh 명령과 파일 수정을 위해 필수.
          # 이 줄이 없으면 Claude 가 도구 호출 시 권한 거부되어 아무 작업도 못 합니다.
          claude_args: "--allowedTools 'Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(gh:*)'"
          prompt: |
            You are helping resolve merge conflicts on this pull request.

            Workflow:
            1. Check out the PR head branch.
            2. Run `git fetch origin` and attempt
               `git merge origin/${{ github.event.repository.default_branch }}`
               to surface conflicts.
            3. If conflicts are present, resolve them by understanding the intent of
               both sides plus any extra guidance present in the user's comment that
               triggered you.
            4. Commit the resolution with a clear message
               (e.g. "resolve conflicts with ${{ github.event.repository.default_branch }}")
               and push back to the PR branch.
            5. Reply on the PR with a short summary of which files had conflicts and
               how each was resolved.
            6. If the conflicting changes express incompatible intents and you cannot
               confidently choose one, do NOT force a resolution — post a comment
               asking the human for explicit guidance instead.

            Do NOT merge the PR. Merging is the human reviewer's responsibility after
            they review your resolution commit.

            Always write any PR comments and the commit message in Korean (한국어).
            Code, identifiers, file paths, and shell commands stay in their original
            form — do not translate those.

      # 위 step 의 success/failure 와 무관하게 항상 마지막 status 를 갱신.
      # Claude 가 새 commit 을 push 했다면 그 새 HEAD 에 status 가 붙습니다.
      - name: Mark check final
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_SHA=$(gh api repos/${{ github.repository }}/pulls/${{ github.event.issue.number }} --jq .head.sha)
          if [[ "${{ job.status }}" == "success" ]]; then
            STATE="success"
            DESC="충돌 해결 완료"
          else
            STATE="failure"
            DESC="실패 — Actions 탭의 로그를 확인하세요"
          fi
          gh api repos/${{ github.repository }}/statuses/$PR_SHA -X POST \
            -f state=$STATE \
            -f context="agent-worker/resolve" \
            -f description="$DESC" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
