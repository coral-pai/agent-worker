# Agent Worker 설정 파일
# 이 파일을 복사해서 본인 환경에 맞게 수정하세요:
#   cp agent-worker.example.yaml agent-worker.yaml

provider:
  # 사용할 티켓 provider. 지원: "linear", "github"
  type: linear

  # provider를 폴링하는 주기(초). 기본값: 60
  poll_interval_seconds: 60

  # provider별 연결 설정 — 위의 `type`에 해당하는 블록만 채우면 됩니다.

  # --- Linear (type: linear) ---
  # LINEAR_API_KEY 환경 변수가 필요합니다.
  linear:
    # Linear 프로젝트 UUID (필수)
    # 위치: Linear → Settings → Projects → 프로젝트 클릭 → URL에서 ID 복사
    project_id: "your-project-uuid-here"

  # --- GitHub Projects v2 (type: github) ---
  # GITHUB_TOKEN 환경 변수가 필요합니다 (`project` scope, private repo면 `repo`도 필요).
  # github:
  #   owner: "your-org-or-user"     # 프로젝트를 소유한 조직 또는 사용자 (필수)
  #   owner_type: organization      # "organization" (기본값) 또는 "user"
  #   project_number: 1             # 프로젝트 번호. URL 참고: github.com/orgs/<owner>/projects/<N>
  #   status_field_name: "Status"   # 상태로 사용할 single-select 필드 이름 (기본값: "Status")

# provider의 상태 옵션 이름을 agent의 라이프사이클 단계에 매핑합니다 (필수).
# 각 값은 provider의 실제 상태 옵션 이름과 정확히 일치해야 합니다 (대소문자/공백 포함).
#   - Linear: 팀의 워크플로 상태 이름
#   - GitHub Projects: `status_field_name`으로 지정한 single-select 필드의 옵션 이름
lifecycle:
  ready: "Todo"              # 에이전트가 픽업할 대상으로 표시하는 상태
  in_progress: "In Progress" # 에이전트가 티켓을 잡았을 때 전환되는 상태
  in_review: "In Review"     # 에이전트 작업 + post-hook 성공 후 전환되는 상태
                             # PR 머지 등으로 "완료(Done)" 처리하는 건 외부 자동화의 책임입니다
                             # (예: GitHub Project workflow의 "Pull request merged → Done")
  failed: "Canceled"         # 에이전트가 실패했을 때 전환되는 상태

repo:
  # 에이전트가 작업할 git 저장소의 절대 경로 (필수)
  path: "/path/to/your/repo"

hooks:
  # 에이전트 호출 BEFORE 실행할 셸 명령 (선택)
  # 한 명령이라도 실패하면 티켓은 failed 처리되고 에이전트는 실행되지 않습니다.
  # 사용 가능한 변수:
  #   {id}         — 티켓 식별자 (예: ENG-42, owner/repo#42)
  #   {title}      — 슬러그 처리된 제목 (예: add-login-page)
  #   {raw_title}  — 원본 제목 (셸 안전 처리됨)
  #   {branch}     — 자동 생성된 브랜치 이름 (agent/task-{id})
  #   {worktree}   — 에이전트가 실행될 워크트리 경로
  #   {date}       — 현재 시각 (ISO 8601)
  # 참고: Claude executor는 git 워크트리를 자동 생성하므로 pre-hook에 branch/checkout
  #       명령을 넣을 필요가 없습니다. Codex는 자체 워크트리를 관리하므로 hook은
  #       원본 repo 경로에서 실행됩니다.
  pre: []

  # 에이전트가 성공한 AFTER 실행할 셸 명령 (선택)
  # 한 명령이라도 실패하면 티켓은 failed 처리됩니다.
  post:
    - "git add -A"
    - "git commit -m '{id}: {raw_title}'"
    - "git push origin {branch}"
    - "gh pr create --title '{id}: {raw_title}' --body 'Fixes {id}. Implemented by Agent Worker.' --base main"

executor:
  # 사용할 에이전트 하네스: "claude" (기본값) 또는 "codex"
  type: claude

  # 에이전트가 작업을 끝낼 수 있는 최대 시간(초). 기본값: 300
  timeout_seconds: 300

  # 실패 시 재시도 횟수, 0~3. 기본값: 0
  retries: 0

log:
  # 로그 파일 경로 (선택 — 생략 시 stdout으로만 출력)
  file: "./agent-worker.log"

  # 로그 레벨: debug | info | warn | error. 기본값: info
  level: info
